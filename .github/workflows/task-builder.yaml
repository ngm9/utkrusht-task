name: Task Builder prod deployment

# Prod counterpart of task-builder-dev.yaml — same pipeline, triggered from
# the release branch, publishing the non-dev image and hitting the prod
# Coolify webhook.

on:
  push:
    branches:
      - main
    paths:
      - 'task_builder/**'
      - 'flows/**'
      - 'infra/**'
      - 'apps/**'
      - 'task_generation_prompts/**'
      - 'task_input_parser/**'
      - 'task_quality/**'
      - 'task_validation/**'
      - 'requirements.txt'
      - '.github/workflows/task-builder.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: task-builder-prod
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, udev1]
    environment: task-builder
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          name: persistent-builder
          cleanup: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/arm64
          provenance: false
          sbom: false
          context: .
          file: ./task_builder/Dockerfile
          push: true
          tags: |
            ghcr.io/ngm9/utkrusht-task-builder:latest
            ghcr.io/ngm9/utkrusht-task-builder:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_TASK_BUILDER_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          # force=true is REQUIRED: the image tag is a static ':latest', so
          # without it Coolify sees an unchanged image reference and returns
          # success WITHOUT pulling/redeploying — the container keeps running the
          # old image. This is exactly why the #50 merge built + pushed but never
          # went live (last real deploy was a day earlier, Manual). Append force
          # respecting whether the webhook URL already carries a query string.
          case "$WEBHOOK" in
            *\?*) url="${WEBHOOK}&force=true" ;;
            *)    url="${WEBHOOK}?force=true" ;;
          esac

          # Capture body + HTTP code separately so we can FAIL on a 2xx that
          # didn't actually queue a deployment (the old `curl -fsS` passed on any
          # 2xx, hiding "nothing deployed").
          resp="$(curl -sS -m 30 -w $'\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" "$url" || true)"
          body="$(printf '%s' "$resp" | sed '$d')"
          code="$(printf '%s' "$resp" | tail -n1)"
          [ -n "$code" ] || code="000"
          echo "Coolify HTTP $code"
          echo "Response: $body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Coolify deploy webhook returned HTTP $code"
            exit 1
          fi
          # Coolify returns a deployment_uuid / "Deployment(s) queued." on a real
          # trigger. Match those specifically — a bare 'deployment' also appears in
          # "No new deployment needed", which is exactly the no-op we must catch.
          if ! printf '%s' "$body" | grep -qiE 'deployment_uuid|queued'; then
            echo "::error::Webhook accepted (HTTP $code) but no deployment was queued — check the app UUID in COOLIFY_TASK_BUILDER_DEPLOY_WEBHOOK and that auto-deploy is enabled."
            exit 1
          fi
          echo "Deployment queued."
