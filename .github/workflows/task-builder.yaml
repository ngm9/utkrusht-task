name: Task Builder prod deployment

# Prod counterpart of task-builder-dev.yaml — same pipeline, triggered from
# the release branch, publishing the non-dev image and hitting the prod
# Coolify webhook.

on:
  push:
    branches:
      - main
    paths:
      - 'task_builder/**'
      - 'flows/**'
      - 'infra/**'
      - 'apps/**'
      - 'task_generation_prompts/**'
      - 'task_input_parser/**'
      - 'task_quality/**'
      - 'task_validation/**'
      - 'requirements.txt'
      - '.github/workflows/task-builder.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: task-builder-prod
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, udev1]
    environment: task-builder
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          name: persistent-builder
          cleanup: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          provenance: false
          sbom: false
          context: .
          file: ./task_builder/Dockerfile
          push: true
          tags: |
            ghcr.io/ngm9/utkrusht-task-builder:latest
            ghcr.io/ngm9/utkrusht-task-builder:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_TOKEN }}" \
          "${{ secrets.COOLIFY_TASK_BUILDER_DEPLOY_WEBHOOK }}"
