name: Task Builder dev deployment

# Mirrors the Utkrushta backend deploy pattern (notifications-dev.yaml):
# test -> build linux/arm64 on the self-hosted udev1 runner -> push to GHCR
# -> trigger the Coolify deploy webhook.
#
# NOTE: the udev1 self-hosted runner must be registered to THIS repo (it was
# originally registered to ngm9/Utkrushta) — see task_builder/DEPLOYMENT.md.

on:
  push:
    branches:
      - main
      - task-builder-service
    paths:
      - 'task_builder/**'
      - 'flows/**'
      - 'infra/**'
      - 'apps/**'
      - 'task_generation_prompts/**'
      - 'task_input_parser/**'
      - 'task_quality/**'
      - 'task_validation/**'
      - 'requirements.txt'
      - '.github/workflows/task-builder-dev.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: task-builder-dev
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run task_builder unit tests
        run: pytest task_builder/tests/ -q

  build:
    needs: test
    runs-on: [self-hosted, udev1]
    environment: task-builder-dev
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          name: persistent-builder
          cleanup: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          provenance: false
          sbom: false
          context: .
          file: ./task_builder/Dockerfile
          push: true
          tags: |
            ghcr.io/ngm9/utkrusht-task-builder-dev:latest
            ghcr.io/ngm9/utkrusht-task-builder-dev:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X POST \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_TOKEN }}" \
          "${{ secrets.COOLIFY_TASK_BUILDER_DEV_DEPLOY_WEBHOOK }}"
