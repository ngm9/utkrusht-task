<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Builder · Utkrusht</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <img class="logo" src="/static/logo.svg" alt="Utkrusht" width="28" height="28" />
    <span class="wordmark">Utkrusht</span>
    <span class="header-sep" aria-hidden="true"></span>
    <h1>Task <span class="shimmer">Builder</span></h1>
    <div class="header-actions">
      <button id="new-task" class="hbtn" type="button">New task</button>
      <button id="download-pdf" class="hbtn" type="button">Download PDF</button>
    </div>
  </header>
  <div class="print-head" aria-hidden="true">Utkrusht Task Builder — <span id="print-date"></span></div>

  <div class="layout">
    <main>
      <div class="chat" id="chat"></div>
      <div class="starters" id="starters" hidden>
        <div class="starters-label">Try one of these to get going:</div>
        <div class="starters-row" id="starters-row"></div>
      </div>
      <div class="dock">
        <div class="dock-inner">
          <input type="text" id="msg" placeholder="Type a message…" autocomplete="off" />
          <button id="send">Send</button>
        </div>
      </div>
    </main>

    <aside class="brief-panel" id="brief-panel" aria-label="Task brief">
      <div class="panel-section">
        <div class="panel-title">Task brief</div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="brief-progress"></div></div>
        <div class="progress-label" id="brief-progress-label">0 of 5 fields</div>
        <ul class="slots" id="slots"></ul>
      </div>
      <div class="panel-section panel-generate">
        <label class="env-pick">Environment
          <select id="env">
            <option value="dev">dev</option>
            <option value="prod">prod</option>
          </select>
        </label>
        <button class="cta" id="gen" disabled>Generate task →</button>
        <div class="gen-hint" id="gen-hint">Answer the questions in the chat — the brief fills in here as you go.</div>
      </div>
      <div class="panel-section panel-run" id="panel-run" hidden>
        <div class="panel-title">Pipeline</div>
        <ul class="run-stages" id="run-stages"></ul>
        <div class="run-result" id="run-result" hidden></div>
      </div>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
